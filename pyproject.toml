[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license expression + license-files
build-backend = "hatchling.build"

[project]
name = "sioff"
version = "0.1.0"
description = "siOFF — siRNA off-target discovery pipeline for analyzing RIsearch2 predictions"
readme = "README.md"
requires-python = ">=3.11"
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [{ name = "Lorenzo Favaro", email = "lorenzo@rth.dk" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "biopython",
  "loguru",
  "ncls>=0.0.63",
  "numpy>=2.4.1",
  "omegaconf>=2.3.0",
  "polars[rtcompat]>=1.0",
  "pyarrow",
  "pyyaml",
  "rich>=14.3.0",
  # Exact pin: risearch is an alpha series whose Python API and search results
  # can change between alphas. Bump deliberately, after re-running the test
  # suite and comparing search output on the fixtures (see README, "The
  # risearch dependency").
  "risearch==3.0.0a4",
  "typer",
  "viennaRNA==2.7.2",
]

[project.urls]
Homepage = "https://github.com/lorenzo-22/siOFF"
Repository = "https://github.com/lorenzo-22/siOFF"
Issues = "https://github.com/lorenzo-22/siOFF/issues"

[project.scripts]
sioff = "sioff.cli:entrypoint"

[dependency-groups]
dev = [
  "pre-commit",
  # Pinned: pyrefly is the blocking type-check gate; an unpinned upgrade could
  # flag new errors and redden CI on an unrelated `uv lock`. Bump deliberately.
  "pyrefly==0.64.1",
  "pytest",
  "ruff",
  "scalene>=2.1.3",
  "ty",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyrefly]
# scripts/ is not packaged (no console script, excluded from the wheel), but it is
# user-facing orchestration and was previously outside every gate — type-checked
# here so it cannot drift.
project-includes = ["src", "scripts"]
# Type-check against the lowest supported version to catch newer-stdlib usage.
python-version = "3.11"
# `risearch` is a compiled extension imported lazily; treat it as `Any` so the
# type check does not depend on its generated stub.
replace-imports-with-any = ["risearch"]

[tool.hatch.build.targets.wheel]
packages = ["src/sioff"]

[tool.uv]
package = true
default-groups = ["dev"]
